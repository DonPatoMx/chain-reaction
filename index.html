<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ff9e7a">
<title>Chain Reaction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="gLine" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="#8fe9ff"/><stop offset=".55" stop-color="#27b6f6"/><stop offset="1" stop-color="#0b7fd6"/></radialGradient>
  <radialGradient id="gDouble" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="#f4c4ff"/><stop offset=".55" stop-color="#b36bf5"/><stop offset="1" stop-color="#7a35d6"/></radialGradient>
  <radialGradient id="gBomb" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="#ffe08a"/><stop offset=".55" stop-color="#ff9a2e"/><stop offset="1" stop-color="#ee5a1c"/></radialGradient>
  <radialGradient id="gCoin" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#fff3a8"/><stop offset=".6" stop-color="#ffc928"/><stop offset="1" stop-color="#e8940c"/></radialGradient>
  <radialGradient id="gRock" cx="38%" cy="28%" r="85%"><stop offset="0" stop-color="#c9cfdc"/><stop offset=".6" stop-color="#8d96ad"/><stop offset="1" stop-color="#5f6880"/></radialGradient>
</defs></svg>

<div id="app">
  <section id="map" class="screen" hidden>
    <div class="mapScroll" id="mapScroll"><div id="mapInner"></div></div>
    <header class="hud">
      <div class="chip" aria-label="Estrellas"><span data-icon="star"></span><b class="nStars">0</b></div>
      <div class="chip" aria-label="Monedas"><span data-icon="coin"></span><b class="nCoins">0</b></div>
      <div class="chip" aria-label="Cristales"><span data-icon="gem"></span><b class="nGems">0</b></div>
      <button class="round" id="openSettings" aria-label="Ajustes"><span data-icon="gear"></span></button>
    </header>
    <div class="mapBottom">
      <div class="sideBtns">
        <button class="tool" id="openGift"><span data-icon="gift"></span>Regalo<i id="giftDot" class="dot" hidden></i></button>
        <button class="tool" id="openDaily"><span data-icon="bolt"></span>Reto<i id="dailyDot" class="dot" hidden></i></button>
        <button class="tool" id="openAlbum"><span data-icon="heart"></span>Amigos</button>
        <button class="tool" id="openVillage"><span data-icon="home"></span>Pueblo<i id="buildDot" class="dot" hidden></i></button>
      </div>
      <button class="big green" id="play"></button>
    </div>
  </section>

  <section id="village" class="screen" hidden>
    <div id="scene" class="scene"></div>
    <header class="hud">
      <button class="round" id="villageBack" aria-label="Volver al mapa"><span data-icon="map"></span></button>
      <div class="chip" aria-label="Estrellas"><span data-icon="star"></span><b class="nStars">0</b></div>
      <div class="chip" aria-label="Monedas"><span data-icon="coin"></span><b class="nCoins">0</b></div>
    </header>
    <h1 class="townTitle" id="townTitle"></h1>
    <div class="homeBottom">
      <button class="buildCard" id="build"></button>
      <button class="big green" id="toMap">Ir al mapa</button>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <header class="hud">
      <button class="round" id="back" aria-label="Volver al mapa"><span data-icon="home"></span></button>
      <div class="levelBox"><b id="levelName"></b><div id="liveStars" class="liveStars"></div></div>
      <div class="chip" aria-label="Monedas"><span data-icon="coin"></span><b class="nCoins">0</b></div>
    </header>
    <div class="say" id="say"><div class="sayFace" id="sayFace"></div><p id="sayText"></p></div>
    <div class="boardWrap" id="boardWrap">
      <div class="board" id="board"></div>
      <svg class="fx" id="fx" aria-hidden="true"></svg>
      <div class="comboText" id="comboText" aria-live="off"></div>
      <div class="hand" id="hand" hidden></div>
    </div>
    <div class="gameBottom">
      <button class="tool wide" id="reset"><span data-icon="undo"></span>Reiniciar</button>
      <button class="tool wide" id="hint"><span data-icon="bulb"></span>Pista <small id="hintCost"></small></button>
    </div>
  </section>

  <div class="sheetBack" id="sheetBack" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="flyLayer" aria-hidden="true"></div>
</div>

<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/village.js"></script>
<script src="js/map.js"></script>
<script src="js/game.js"></script>
</body>
</html>
